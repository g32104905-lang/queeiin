<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queen_Delsin</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&family=Lalezar&family=Harmattan:wght@400;700&family=Reem+Kufi&family=Cairo:wght@400;800&family=Almarai:wght@400;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--p:#c1121f;--t:#f5f5f5;--b:#0b0b0f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,color-mix(in srgb,var(--p) 25%,var(--b)),var(--b) 60%) fixed;color:var(--t);min-height:100vh;font-family:Vazirmatn,sans-serif}
a{color:inherit;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:center;padding:14px 10px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;perspective:600px;border-bottom:1px solid var(--p)}
.n-side nav{position:fixed;top:0;right:0;bottom:0;width:130px;flex-direction:column;justify-content:flex-start;border-bottom:0;border-left:1px solid var(--p)}
.n-side main{margin-right:130px}
.d3{display:inline-block;font-weight:800;font-size:1.05rem;transform-style:preserve-3d;animation:sw 3.5s ease-in-out infinite alternate;text-shadow:1px 1px 0 var(--p),2px 2px 0 var(--p),3px 3px 0 #000,4px 5px 6px #000}
.d3.big{font-size:1.5rem;animation-duration:2.5s}
nav a:nth-child(even){animation-delay:-1.2s}
@keyframes sw{from{transform:rotateY(-28deg) rotateX(8deg)}to{transform:rotateY(28deg) rotateX(-8deg)}}
main{max-width:980px;margin:auto;padding:18px}
h2{text-shadow:0 0 12px var(--p)}
.card{background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--p) 55%,transparent);border-radius:16px;padding:16px;margin:12px 0}
.btn{font:inherit;cursor:pointer;color:#fff;background:var(--p);border:0;padding:10px 20px;margin:4px;transition:.2s}
.btn:hover{filter:brightness(1.25);transform:translateY(-2px)}
.b-pill .btn{border-radius:999px}.b-sq .btn{border-radius:4px}
.b-3d .btn{border-radius:10px;border-bottom:5px solid rgba(0,0,0,.55)}
.b-neon .btn{background:transparent;border:2px solid var(--p);border-radius:10px;box-shadow:0 0 12px var(--p),inset 0 0 8px var(--p)}
input,select,textarea{font:inherit;width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid var(--p);background:rgba(0,0,0,.5);color:var(--t)}
input[type=color]{height:40px;padding:2px}
.coins{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 18px;border-radius:999px;border:1px solid var(--p);cursor:pointer;background:rgba(0,0,0,.4)}
.chip.on{background:var(--p)}
.addr{direction:ltr;word-break:break-all;background:#000a;padding:10px;border-radius:10px;font-family:monospace}
.modal{position:fixed;inset:0;background:#000d;z-index:50;display:none;overflow:auto;padding:14px}
.modal.on{display:block}.modal>div{max-width:620px;margin:auto}
#wheelBox{text-align:center;padding:12px;background:var(--b);border-radius:16px}
#pointer{width:0;height:0;border:14px solid transparent;border-top:30px solid #fff;margin:0 auto -22px;position:relative;z-index:2}
#wc{transition:transform 5s cubic-bezier(.12,.7,.1,1);max-width:100%}
.drip{position:fixed;top:0;z-index:9;pointer-events:none;height:0;border-radius:0 0 50% 50%;background:linear-gradient(#5a0008,#b30012 70%,#e0001a);animation:dr var(--d) ease-in forwards}
@keyframes dr{0%{height:0;opacity:1}70%{height:var(--h);opacity:1}100%{height:calc(var(--h) + 40px);opacity:0}}
.sd{position:fixed;right:0;z-index:9;pointer-events:none;width:0;border-radius:50% 0 0 50%;background:linear-gradient(270deg,#5a0008,#c1001a);animation:sdr 7s ease-out forwards}
@keyframes sdr{0%{width:0;opacity:1}60%{width:var(--w);opacity:1}100%{width:var(--w);opacity:0}}
.girl{position:absolute;z-index:99;width:62px;pointer-events:none;animation:gp 1.4s ease-out forwards;text-align:center;font-size:12px}
@keyframes gp{0%{transform:scale(0) rotate(-20deg)}20%{transform:scale(1.1) rotate(8deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(8deg)}85%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.post img{max-width:100%;border-radius:12px}
#gear{position:fixed;bottom:10px;left:10px;opacity:.5;z-index:30}
@media(prefers-reduced-motion:reduce){.d3{animation:none}}
</style>
<style id="ucss"></style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<button class="btn" id="gear" onclick="openAdmin()">⚙</button>

<div class="modal" id="wm"><div>
 <div id="wheelBox">
  <h3>🎡 <span id="wtitle"></span></h3>
  <input id="wname" placeholder="نام یا آیدی تلگرام شما">
  <div id="pointer"></div><canvas id="wc" width="340" height="340"></canvas>
  <div id="wres" style="font-size:1.4rem;min-height:2em;font-weight:800"></div>
 </div>
 <button class="btn" id="spin" onclick="spin()">چرخش</button>
 <button class="btn" onclick="wm.classList.remove('on')">بستن</button>
</div></div>

<div class="modal" id="am"><div class="card" id="ab"></div></div>

<script>
const D={title:'Queen_Delsin',p:'#c1121f',t:'#f5f5f5',b:'#0b0b0f',font:'Vazirmatn',btn:'pill',navPos:'top',blood:true,
tgToken:'',tgChat:'@Queen_Delsin',adminPw:'admin1234',vipPw:'mis1234',css:'',
nav:[{t:'خانه',p:'home'},{t:'گردونه',p:'wheel'},{t:'پست‌ها',p:'posts'},{t:'رضایت‌نامه',p:'terms'},{t:'VIP',p:'vip'}],
coins:[
{n:'USDT',nets:{TRC20:'ADDRESS_HERE',BEP20:'ADDRESS_HERE',ERC20:'ADDRESS_HERE'}},
{n:'BTC',nets:{Bitcoin:'ADDRESS_HERE'}},
{n:'ETH',nets:{ERC20:'ADDRESS_HERE',Arbitrum:'ADDRESS_HERE'}},
{n:'TRX',nets:{TRC20:'ADDRESS_HERE'}},
{n:'TON',nets:{TON:'ADDRESS_HERE'}},
{n:'BNB',nets:{BEP20:'ADDRESS_HERE'}}],
prizes:['500 تومان','700 تومان','1,000,000 تومان','2,000,000 تومان','3,000,000 تومان'],
wheelTitle:'گردونه شانس',
posts:[{t:'اولین پست',x:'متن پست را از پنل مدیریت ویرایش کنید.',i:''}],
terms:'متن رضایت‌نامه را از پنل مدیریت بنویسید.',
vip:'<h2>بخش VIP</h2><p>محتوای ویژه اینجاست.</p><button class="btn">دکمه نمونه</button>'};
let S;try{S={...D,...JSON.parse(localStorage.qd||'{}')}}catch(e){S={...D}}
const $=id=>document.getElementById(id);
const save=()=>{localStorage.qd=JSON.stringify(S)};
const TPL={blood:['#c1121f','#0b0b0f','#f5f5f5'],neon:['#00f5d4','#10002b','#ffffff'],gold:['#d4af37','#111111','#ffffff'],light:['#7c3aed','#f7f7fb','#111111']};
const FONTS=['Vazirmatn','Lalezar','Harmattan','Reem Kufi','Cairo','Almarai'];
let coin=null,net=null;

function R(){
 const r=document.documentElement.style;r.setProperty('--p',S.p);r.setProperty('--t',S.t);r.setProperty('--b',S.b);
 document.body.className='b-'+S.btn+' n-'+S.navPos;
 document.body.style.fontFamily=`'${S.font}',sans-serif`;
 $('ucss').textContent=S.css;document.title=S.title;
 $('nav').innerHTML=`<a class="d3 big" href="#home">${S.title}</a>`+S.nav.map(n=>`<a class="d3" ${/^http/.test(n.p)?`href="${n.p}" target="_blank"`:`href="#${n.p}"`}>${n.t}</a>`).join('');
 route();
}
function route(){
 const p=location.hash.slice(1)||'home',a=$('app');
 if(p=='home'){
  a.innerHTML=`<h2>💎 ارز دیجیتال</h2><div class="coins">${S.coins.map((c,i)=>`<div class="chip ${coin===i?'on':''}" onclick="pick(${i})">${c.n}</div>`).join('')}</div><div id="cbox"></div>`;
  if(coin!==null)cbox();
 }else if(p=='wheel'){
  a.innerHTML=`<h2>🎡 ${S.wheelTitle}</h2><div class="card">برای شرکت در قرعه‌کشی وارد گردونه شوید.<br><button class="btn" onclick="openWheel()">ورود به گردونه</button></div>`;
 }else if(p=='posts'){
  a.innerHTML='<h2>پست‌ها</h2>'+S.posts.map(x=>`<div class="card post"><h3>${x.t}</h3>${x.i?`<img src="${x.i}">`:''}<p>${x.x}</p></div>`).join('');
 }else if(p=='terms'){
  a.innerHTML=`<h2>رضایت‌نامه</h2><div class="card">${S.terms}</div>`;
 }else if(p=='vip'){
  if(sessionStorage.vip)a.innerHTML=S.vip;
  else a.innerHTML=`<h2>🔒 VIP</h2><div class="card"><input id="vp" type="password" placeholder="رمز VIP"><button class="btn" onclick="vipGo()">ورود</button></div>`;
 }else a.innerHTML='<h2>صفحه پیدا نشد</h2>';
}
function vipGo(){if($('vp').value==S.vipPw){sessionStorage.vip=1;route()}else alert('رمز اشتباه است')}
function pick(i){coin=i;net=Object.keys(S.coins[i].nets)[0];route()}
function cbox(){
 const c=S.coins[coin],ns=Object.keys(c.nets);
 $('cbox').innerHTML=`<div class="card"><b>شبکه:</b><select onchange="net=this.value;cbox()">${ns.map(n=>`<option ${n==net?'selected':''}>${n}</option>`).join('')}</select>
 <p>آدرس ولت ${c.n} (${net}):</p><div class="addr">${c.nets[net]}</div>
 <button class="btn" onclick="navigator.clipboard.writeText('${c.nets[net]}');alert('کپی شد')">کپی آدرس</button>
 <input id="txh" placeholder="هش تراکنش (TXID)"><button class="btn" onclick="sendHash()">ارسال هش</button></div>`;
}
async function tg(m,blob,cap){
 if(!S.tgToken||!S.tgChat){alert('توکن ربات تلگرام در پنل مدیریت تنظیم نشده');return false}
 const u=`https://api.telegram.org/bot${S.tgToken}/`;
 try{
  if(blob){const f=new FormData();f.append('chat_id',S.tgChat);f.append('caption',cap||'');f.append('photo',blob,'s.png');return (await fetch(u+'sendPhoto',{method:'POST',body:f})).ok}
  return (await fetch(u+'sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.tgChat,text:m})})).ok;
 }catch(e){return false}
}
async function sendHash(){
 const h=$('txh').value.trim();if(!h)return alert('هش را وارد کنید');
 const ok=await tg(`💰 تراکنش جدید\nارز: ${S.coins[coin].n}\nشبکه: ${net}\nآدرس: ${S.coins[coin].nets[net]}\nهش: ${h}`);
 alert(ok?'ارسال شد ✅':'ارسال ناموفق ❌');if(ok)$('txh').value='';
}

/* wheel */
let rot=0,busy=false;
function drawWheel(){
 const c=$('wc'),x=c.getContext('2d'),n=S.prizes.length,s=2*Math.PI/n,col=[S.p,'#222','#e0a800','#444','#7a0010','#111'];
 x.clearRect(0,0,340,340);
 for(let i=0;i<n;i++){
  x.beginPath();x.moveTo(170,170);x.arc(170,170,165,-Math.PI/2+i*s,-Math.PI/2+(i+1)*s);x.fillStyle=col[i%col.length];x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
  x.save();x.translate(170,170);x.rotate(-Math.PI/2+(i+.5)*s);x.fillStyle='#fff';x.font='bold 15px Vazirmatn,sans-serif';x.textAlign='right';x.fillText(S.prizes[i],150,5);x.restore();
 }
}
function openWheel(){$('wtitle').textContent=S.wheelTitle;$('wres').textContent='';drawWheel();$('wm').classList.add('on')}
function spin(){
 if(busy)return;if(!$('wname').value.trim())return alert('نام خود را وارد کنید');
 busy=true;$('wres').textContent='';
 const n=S.prizes.length,i=Math.floor(Math.random()*n),center=(i+.5)*360/n;
 rot=rot-(rot%360)+360*6+(360-center);
 $('wc').style.transform=`rotate(${rot}deg)`;
 setTimeout(async()=>{
  const pr=S.prizes[i];$('wres').textContent='🎉 '+pr;
  try{const cv=await html2canvas($('wheelBox'),{backgroundColor:S.b});
   cv.toBlob(async b=>{const ok=await tg('',b,`🎡 نتیجه گردونه\nکاربر: ${$('wname').value}\nجایزه: ${pr}`);if(!ok)await tg(`🎡 کاربر ${$('wname').value} برنده شد: ${pr}`)});
  }catch(e){await tg(`🎡 کاربر ${$('wname').value} برنده شد: ${pr}`)}
  busy=false;
 },5300);
}

/* effects */
function blood(){
 if(!S.blood)return;
 for(let i=0;i<16;i++){const d=document.createElement('div');d.className='drip';
  d.style.cssText=`left:${Math.random()*100}%;width:${5+Math.random()*10}px;--h:${80+Math.random()*260}px;--d:${3+Math.random()*4}s;animation-delay:${Math.random()*1.5}s`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),10000)}
 for(let i=0;i<3;i++){const d=document.createElement('div');d.className='sd';
  d.style.cssText=`top:${10+Math.random()*80}%;height:${4+Math.random()*4}px;--w:${20+Math.random()*30}px;animation-delay:${1+Math.random()*3}s`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),12000)}
}
const GIRL=`<svg viewBox="0 0 100 100"><path d="M10 60C5 20 30 2 50 4s45 16 40 56c-4-18-14-30-40-30S14 42 10 60z" fill="#3a1d3f"/><circle cx="50" cy="58" r="33" fill="#ffe3d3"/><path d="M17 55C20 30 38 24 50 28c14-4 30 4 33 27-10-12-22-16-33-14-12-2-26 4-33 14z" fill="#3a1d3f"/><path d="M33 58q6-9 12 0M56 58q6-9 12 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="29" cy="68" rx="6" ry="3.5" fill="#ff8fa3" opacity=".7"/><ellipse cx="71" cy="68" rx="6" ry="3.5" fill="#ff8fa3" opacity=".7"/><path d="M40 72q10 14 20 0z" fill="#c9184a"/><circle cx="20" cy="22" r="7" fill="#ff5d8f"/><circle cx="80" cy="22" r="7" fill="#ff5d8f"/></svg><div>هیهی~ 😆</div>`;
document.addEventListener('click',e=>{
 if(!e.target.closest('.btn'))return;
 const g=document.createElement('div');g.className='girl';g.innerHTML=GIRL;
 g.style.left=(e.pageX-30)+'px';g.style.top=(e.pageY-85)+'px';
 document.body.appendChild(g);setTimeout(()=>g.remove(),1500);
});

/* admin */
function openAdmin(){
 const p=prompt('رمز پنل مدیریت');if(p!==S.adminPw)return p!==null&&alert('رمز اشتباه');
 const v=(k)=>String(S[k]).replace(/"/g,'&quot;');
 $('ab').innerHTML=`<h3>⚙ پنل مدیریت</h3>
 قالب آماده:<select id="a_tpl" onchange="tplSet()"><option value="">انتخاب...</option>${Object.keys(TPL).map(k=>`<option>${k}</option>`).join('')}</select>
 عنوان سایت:<input id="a_title" value="${v('title')}">
 رنگ اصلی:<input id="a_p" type="color" value="${S.p}">
 رنگ متن:<input id="a_t" type="color" value="${S.t}">
 رنگ پس‌زمینه:<input id="a_b" type="color" value="${S.b}">
 فونت:<select id="a_font">${FONTS.map(f=>`<option ${f==S.font?'selected':''}>${f}</option>`).join('')}</select>
 مدل دکمه:<select id="a_btn">${['pill','sq','3d','neon'].map(f=>`<option ${f==S.btn?'selected':''}>${f}</option>`).join('')}</select>
 جای نوار منو:<select id="a_nav"><option value="top" ${S.navPos=='top'?'selected':''}>بالا</option><option value="side" ${S.navPos=='side'?'selected':''}>کنار</option></select>
 <label><input type="checkbox" id="a_blood" ${S.blood?'checked':''} style="width:auto"> افکت خون</label><br>
 عنوان گردونه:<input id="a_wt" value="${v('wheelTitle')}">
 جوایز گردونه (هر خط یکی):<textarea id="a_pr" rows="5">${S.prizes.join('\n')}</textarea>
 منو (JSON، p می‌تواند home/wheel/posts/terms/vip یا لینک http):<textarea id="a_navj" rows="5">${JSON.stringify(S.nav)}</textarea>
 ارزها و آدرس‌ها (JSON):<textarea id="a_coins" rows="8">${JSON.stringify(S.coins,null,1)}</textarea>
 پست‌ها (JSON: t عنوان، x متن، i آدرس عکس):<textarea id="a_posts" rows="5">${JSON.stringify(S.posts)}</textarea>
 افزودن عکس به پست جدید:<input type="file" accept="image/*" onchange="addImg(this)">
 متن رضایت‌نامه (HTML):<textarea id="a_terms" rows="4">${S.terms}</textarea>
 محتوای VIP (HTML، می‌توانید دکمه و هر چیزی بگذارید):<textarea id="a_vip" rows="6">${S.vip.replace(/</g,'&lt;')}</textarea>
 رمز VIP:<input id="a_vpw" value="${v('vipPw')}">
 رمز پنل مدیریت:<input id="a_apw" value="${v('adminPw')}">
 توکن ربات تلگرام:<input id="a_tok" value="${v('tgToken')}">
 چت آیدی تلگرام (@channel یا عدد):<input id="a_chat" value="${v('tgChat')}">
 CSS دلخواه:<textarea id="a_css" rows="4">${S.css}</textarea>
 <button class="btn" onclick="adminSave()">ذخیره</button>
 <button class="btn" onclick="navigator.clipboard.writeText(JSON.stringify(S));alert('کپی شد')">خروجی تنظیمات</button>
 <button class="btn" onclick="let j=prompt('JSON تنظیمات');if(j){S={...D,...JSON.parse(j)};save();R();openAdmin()}">وارد کردن</button>
 <button class="btn" onclick="am.classList.remove('on')">بستن</button>`;
 $('am').classList.add('on');
}
function tplSet(){const t=TPL[$('a_tpl').value];if(t){$('a_p').value=t[0];$('a_b').value=t[1];$('a_t').value=t[2]}}
function addImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const l=JSON.parse($('a_posts').value||'[]');l.unshift({t:'پست جدید',x:'متن',i:r.result});$('a_posts').value=JSON.stringify(l)};r.readAsDataURL(f)}
function adminSave(){
 try{
  S={...S,title:$('a_title').value,p:$('a_p').value,t:$('a_t').value,b:$('a_b').value,font:$('a_font').value,btn:$('a_btn').value,navPos:$('a_nav').value,
  blood:$('a_blood').checked,wheelTitle:$('a_wt').value,prizes:$('a_pr').value.split('\n').filter(Boolean),nav:JSON.parse($('a_navj').value),
  coins:JSON.parse($('a_coins').value),posts:JSON.parse($('a_posts').value),terms:$('a_terms').value,vip:$('a_vip').value,vipPw:$('a_vpw').value,
  adminPw:$('a_apw').value,tgToken:$('a_tok').value.trim(),tgChat:$('a_chat').value.trim(),css:$('a_css').value};
  save();R();alert('ذخیره شد ✅');
 }catch(e){alert('خطا در JSON: '+e.message)}
}
addEventListener('hashchange',route);
R();blood();
</script>
</body>
</html>
