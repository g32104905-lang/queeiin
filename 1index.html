<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کوئین دلسین | Queen_Delsin</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--o:#e00000;--o2:#ff3b3b;--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--tx:#eee;--mu:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
a{color:var(--o);text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--o);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;font-size:1.25rem;color:var(--o)}
nav{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
nav a{color:var(--tx)}nav a:hover{color:var(--o)}
.hero{text-align:center;padding:70px 18px 50px;background:radial-gradient(circle at 50% 0,#2b0000 0,#0a0a0a 70%)}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);color:var(--o);font-weight:800;text-shadow:0 0 25px rgba(255,32,32,.45)}
.hero h2{font-weight:300;color:var(--o2);margin:6px 0 16px;direction:ltr}
.hero p{max-width:680px;margin:auto;color:#ccc;white-space:pre-line}
.btn{display:inline-block;background:var(--o);color:#000;border:0;padding:10px 22px;border-radius:10px;font:600 .95rem Vazirmatn,Tahoma;cursor:pointer;margin-top:18px}
.btn:hover{background:var(--o2)}
.btn.sec{background:transparent;color:var(--o);border:1px solid var(--o)}
section{max-width:1000px;margin:auto;padding:46px 16px}
section>h3{font-size:1.5rem;color:var(--o);margin-bottom:6px;border-right:4px solid var(--o);padding-right:10px}
.sub{color:var(--mu);margin-bottom:20px;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card:hover{border-color:var(--o)}
.card img{width:100%;display:block;max-height:340px;object-fit:cover}
.card .b{padding:14px}
.card h4{color:var(--o2);margin-bottom:4px}
.card p{color:#ccc;font-size:.92rem;white-space:pre-line}
.card small{color:var(--mu)}
.code{background:#050505;border:1px solid #333;border-radius:8px;padding:12px;margin:8px 0;direction:ltr;text-align:left;overflow:auto;white-space:pre-wrap;color:#00ff88;font-size:.82rem}
.embed{margin-top:10px}.embed iframe,.embed video{max-width:100%}
.wallet{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.wallet b{color:var(--o)}
.wallet code{direction:ltr;word-break:break-all;color:#ddd;font-size:.85rem;flex:1;min-width:200px;text-align:left}
.wallet button{margin:0;padding:6px 14px}
.stars{text-align:center;background:linear-gradient(160deg,#1c0000,#0f0f0f);border:1px solid var(--o);border-radius:16px;padding:28px}
.stars .big{font-size:2.4rem}
footer{text-align:center;color:var(--mu);padding:26px;border-top:1px solid var(--line);font-size:.85rem}
footer span{cursor:pointer}
.logoimg{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:8px;border:1px solid var(--o)}
.hero{position:relative;overflow:hidden;background-size:cover;background-position:center;padding:90px 18px 70px}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(224,0,0,.28),transparent 45%),radial-gradient(circle at 75% 70%,rgba(255,59,59,.18),transparent 40%);animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.hero>*{position:relative}
.herologo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--o);box-shadow:0 0 30px rgba(224,0,0,.6);margin:0 auto 14px;display:block;animation:float 4s ease-in-out infinite}
.hero h1{animation:glow 3s ease-in-out infinite alternate}
.hero p,.hero h2,.hero .btn{animation:up .9s both}
.hero h2{animation-delay:.15s}.hero p{animation-delay:.3s}.hero .btn{animation-delay:.45s}
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(224,0,0,.45)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
.card{transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 28px rgba(224,0,0,.25)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
details[open]{border-color:var(--o)}
summary{cursor:pointer;color:var(--o2);font-weight:600}
details p{margin-top:8px;color:#ccc;white-space:pre-line}
.contacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.contacts .btn{margin:0}
@keyframes glow{from{text-shadow:0 0 12px rgba(224,0,0,.4)}to{text-shadow:0 0 38px rgba(255,59,59,.95)}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes drift{to{transform:translate(6%,4%) scale(1.1)}}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* admin */
#adm{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;overflow:auto}
#adm .box{max-width:860px;margin:20px auto;background:#101010;border:1px solid var(--o);border-radius:14px;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.tabs button{background:#1d1d1d;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--o);color:#000}
.f{margin-bottom:10px}
.f label{display:block;font-size:.8rem;color:var(--o2)}
.f input,.f textarea{width:100%;background:#1a1a1a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.f textarea{min-height:80px}
.it{border:1px dashed #444;border-radius:10px;padding:10px;margin-bottom:12px}
.it img{max-width:140px;max-height:100px;border-radius:8px;display:block;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:5px 12px;margin:2px;font-size:.8rem}
.btn.red{background:#c0392b;color:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--o);color:#000;padding:8px 18px;border-radius:20px;z-index:200;display:none}
</style>
</head>
<body>
<header>
  <div class="logo" id="t-logo"></div>
  <nav id="nav"></nav>
</header>
<div id="site"></div>
<footer><span id="adminOpen">© <span id="t-foot"></span></span></footer>

<div id="adm"><div class="box" id="admbox"></div></div>
<div id="toast"></div>

<script>
/* ============ داده‌های پیش‌فرض (همه از پنل مدیریت قابل ویرایش) ============ */
const DEF={
 siteName:"کوئین دلسین",siteEn:"Queen_Delsin",
 heroTitle:"کوئین دلسین",heroSub:"Queen_Delsin",
 heroText:"به قلمرو من خوش اومدی.\nاینجا قوانین رو من تعیین می‌کنم.",
 heroBtn:"تماس با من",heroBtnLink:"https://t.me/Queen_Delsin",
 postsTitle:"آخرین پست‌ها",postsSub:"",
 reviewsTitle:"رضایت توله هام",reviewsSub:"نظرات و رضایت‌نامه‌ها",
 cryptoTitle:"پرداخت ارز دیجیتال",cryptoText:"آدرس کیف پول رو کپی کن و بعد از پرداخت، رسید رو برام بفرست.",
 starsTitle:"پرداخت با استارز تلگرام",starsText:"از طریق Telegram Stars پرداخت کن و رسید رو بفرست.",
 starsBtn:"پرداخت با Stars",starsLink:"https://t.me/Queen_Delsin",
 footer:"Queen_Delsin — همه حقوق محفوظ است",
 navPosts:"پست‌ها",navReviews:"رضایت توله هام",navCrypto:"ارز دیجیتال",navStars:"استارز",navSources:"سورس‌ها",logo:"",heroImage:"",navFaq:"سوالات",faqTitle:"سوالات متداول",faqSub:"",faqs:[{q:"چطور پرداخت کنم؟",a:"از بخش ارز دیجیتال یا استارز پرداخت کن و رسید رو برام بفرست."}],navContact:"تماس",contactTitle:"ارتباط با من",contactText:"از طریق راه‌های زیر پیام بده.",contacts:[{label:"تلگرام",url:"https://t.me/Queen_Delsin"}],sourcesTitle:"سورس‌ها",sourcesSub:"",sources:[{title:"نمونه سورس",code:"console.log('Queen_Delsin')"}],
 posts:[{title:"اولین پست",text:"این یک متن نمونه است. از پنل مدیریت ویرایشش کن.",image:"",source:"",html:"",date:""}],
 reviews:[{name:"نمونه",text:"متن رضایت نمونه",image:""}],
 wallets:[{coin:"USDT",network:"TRC20",address:"آدرس-کیف-پول-خودت"}]
};
let D=JSON.parse(JSON.stringify(DEF));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^(https?:|tg:|\/|data:image)/i.test(u||"")?u:"";
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}

/* ============ لود / ذخیره ============ */
async function load(){
  let l=null;try{l=JSON.parse(localStorage.getItem("qd_data")||"null")}catch(_){}
  if(l){D={...D,...l}}
  else{try{const r=await fetch("data.json?"+Date.now());if(r.ok)D={...D,...await r.json()}}catch(_){}}
  render();
}
function save(){
  try{localStorage.setItem("qd_data",JSON.stringify(D))}catch(e){toast("حافظه پر است (عکس‌ها زیادند)");return}
  render();toast("ذخیره شد ✓ (برای همه: data.json بگیر و در گیت‌هاب آپلود کن)");
}

/* ============ نمایش سایت ============ */
function reveal(){
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.06});
  document.querySelectorAll("#site section,#site .card,#site .wallet,#site .stars,#site details").forEach(el=>{el.classList.add("rv");io.observe(el)});
}
function render(){render0();reveal()}
function render0(){
  document.title=D.siteName+" | "+D.siteEn;
  $("#t-logo").innerHTML=(D.logo?`<img class="logoimg" src="${esc(safeUrl(D.logo))}" alt="">`:"👑 ")+esc(D.siteEn);
  $("#t-foot").textContent=D.footer;
  $("#nav").innerHTML=`<a href="#posts">${esc(D.navPosts)}</a><a href="#sources">${esc(D.navSources)}</a><a href="#reviews">${esc(D.navReviews)}</a><a href="#crypto">${esc(D.navCrypto)}</a><a href="#stars">${esc(D.navStars)}</a><a href="#faq">${esc(D.navFaq)}</a><a href="#contact">${esc(D.navContact)}</a>`;
  const posts=D.posts.map(p=>`<div class="card">${p.image?`<img src="${esc(safeUrl(p.image))}" alt="">`:""}<div class="b"><h4>${esc(p.title)}</h4><small>${esc(p.date)}</small><p>${esc(p.text)}</p>${p.source?`<p><a target="_blank" rel="noopener" href="${esc(safeUrl(p.source))}">🔗 سورس / لینک</a></p>`:""}${p.html?`<div class="embed">${p.html}</div>`:""}</div></div>`).join("");
  const revs=D.reviews.map(r=>`<div class="card">${r.image?`<img src="${esc(safeUrl(r.image))}" alt="">`:""}<div class="b"><h4>${esc(r.name)}</h4><p>${esc(r.text)}</p></div></div>`).join("");
  const srcs=D.sources.map((s,i)=>`<div class="card"><div class="b"><h4>${esc(s.title)}</h4><pre class="code">${esc(s.code)}</pre><button class="btn sec" data-copysrc="${i}">📋 کپی سورس</button></div></div>`).join("");
  const wl=D.wallets.map((w,i)=>`<div class="wallet"><b>${esc(w.coin)} <small style="color:#999">${esc(w.network)}</small></b><code>${esc(w.address)}</code><button class="btn sec" data-copy="${i}">کپی</button></div>`).join("");
  $("#site").innerHTML=`
  <div class="hero"${D.heroImage?` style="background-image:linear-gradient(rgba(0,0,0,.6),#0a0a0a),url('${esc(safeUrl(D.heroImage))}')"`:""}>${D.logo?`<img class="herologo" src="${esc(safeUrl(D.logo))}" alt="">`:""}<h1>${esc(D.heroTitle)}</h1><h2>${esc(D.heroSub)}</h2><p>${esc(D.heroText)}</p>${D.heroBtn?`<a class="btn" href="${esc(safeUrl(D.heroBtnLink))}" target="_blank" rel="noopener">${esc(D.heroBtn)}</a>`:""}</div>
  <section id="posts"><h3>${esc(D.postsTitle)}</h3><div class="sub">${esc(D.postsSub)}</div><div class="grid">${posts}</div></section>
  <section id="sources"><h3>${esc(D.sourcesTitle)}</h3><div class="sub">${esc(D.sourcesSub)}</div>${srcs}</section>
  <section id="reviews"><h3>${esc(D.reviewsTitle)}</h3><div class="sub">${esc(D.reviewsSub)}</div><div class="grid">${revs}</div></section>
  <section id="crypto"><h3>${esc(D.cryptoTitle)}</h3><div class="sub">${esc(D.cryptoText)}</div>${wl}</section>
  <section id="stars"><h3>${esc(D.starsTitle)}</h3><div class="stars"><div class="big">⭐</div><p class="sub" style="margin:8px 0">${esc(D.starsText)}</p><a class="btn" target="_blank" rel="noopener" href="${esc(safeUrl(D.starsLink))}">${esc(D.starsBtn)}</a></div></section>
  <section id="faq"><h3>${esc(D.faqTitle)}</h3><div class="sub">${esc(D.faqSub)}</div>${D.faqs.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}</section>
  <section id="contact"><h3>${esc(D.contactTitle)}</h3><div class="sub">${esc(D.contactText)}</div><div class="contacts">${D.contacts.map(c=>`<a class="btn" target="_blank" rel="noopener" href="${esc(safeUrl(c.url))}">${esc(c.label)}</a>`).join("")}</div></section>`;
}
document.addEventListener("click",e=>{
  const cs=e.target.closest("[data-copysrc]");if(cs){navigator.clipboard.writeText(D.sources[cs.dataset.copysrc].code).then(()=>toast("کپی شد ✓"))}
  const c=e.target.closest("[data-copy]");
  if(c){navigator.clipboard.writeText(D.wallets[c.dataset.copy].address).then(()=>toast("کپی شد ✓"))}
});

/* ============ پنل مدیریت ============ */
const adm=$("#adm"),box=$("#admbox");
let tab="texts";
const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const k=p.split(".");const l=k.pop();get(o,k.join("."))?.[l]!==undefined||k.length==0?0:0;(k.length?get(o,k.join(".")):o)[l]=v};
const fld=(label,path,type)=>`<div class="f"><label>${label}</label>${type==="ta"?`<textarea data-p="${path}">${esc(get(D,path))}</textarea>`:`<input data-p="${path}" value="${esc(get(D,path))}">`}</div>`;
function imgField(path){const v=get(D,path);return `<div class="f"><label>عکس (آپلود یا لینک)</label><input data-p="${path}" value="${v&&v.startsWith("data:")?"(عکس آپلود شده)":esc(v)}" ${v&&v.startsWith("data:")?"readonly":""}>${v?`<img src="${esc(safeUrl(v))}">`:""}<input type="file" accept="image/*" data-img="${path}">${v?`<button class="btn sm red" data-clr="${path}">حذف عکس</button>`:""}</div>`}
function ctl(arr,i){return `<div class="row"><button class="btn sm sec" data-up="${arr}.${i}">▲</button><button class="btn sm sec" data-dn="${arr}.${i}">▼</button><button class="btn sm red" data-del="${arr}.${i}">حذف</button></div>`}
function panel(){
  const T={texts:"متن‌ها",look:"ظاهر",posts:"پست‌ها",sources:"سورس‌ها",reviews:"رضایت",crypto:"ارز دیجیتال",stars:"استارز",faq:"سوالات",contact:"تماس",set:"تنظیمات"};
  let h=`<div class="row" style="justify-content:space-between;align-items:center"><b style="color:var(--o)">پنل مدیریت</b><div><button class="btn sm" data-act="save">💾 ذخیره</button><button class="btn sm sec" data-act="close">بستن</button></div></div>
  <div class="tabs">${Object.entries(T).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${v}</button>`).join("")}</div>`;
  if(tab==="texts"){
    h+=fld("نام سایت (فارسی)","siteName")+fld("نام انگلیسی","siteEn")+fld("عنوان اصلی","heroTitle")+fld("زیرعنوان","heroSub")+fld("متن معرفی","heroText","ta")+fld("متن دکمه اصلی","heroBtn")+fld("لینک دکمه اصلی","heroBtnLink")
    +fld("عنوان بخش پست‌ها","postsTitle")+fld("توضیح بخش پست‌ها","postsSub","ta")+fld("عنوان بخش رضایت","reviewsTitle")+fld("توضیح بخش رضایت","reviewsSub","ta")
    +fld("منو: پست‌ها","navPosts")+fld("منو: رضایت","navReviews")+fld("منو: ارز دیجیتال","navCrypto")+fld("منو: استارز","navStars")+fld("متن فوتر","footer");
  }
  if(tab==="look"){
    h+=`<div class="f"><label>لوگو (دایره‌ای، کنار نام و بالای صفحه)</label></div>`+imgField("logo")+`<div class="f"><label>عکس پس‌زمینه‌ی بالای صفحه (بنر)</label></div>`+imgField("heroImage");
  }
  if(tab==="faq"){
    h+=fld("عنوان بخش","faqTitle")+fld("توضیح","faqSub","ta")+fld("منو","navFaq")+`<button class="btn sm" data-add="faqs">+ سوال جدید</button>`;
    D.faqs.forEach((p,i)=>h+=`<div class="it"><b>سوال ${i+1}</b>${fld("سوال",`faqs.${i}.q`)}${fld("پاسخ",`faqs.${i}.a`,"ta")}${ctl("faqs",i)}</div>`);
  }
  if(tab==="contact"){
    h+=fld("عنوان بخش","contactTitle")+fld("توضیح","contactText","ta")+fld("منو","navContact")+`<button class="btn sm" data-add="contacts">+ راه ارتباطی جدید</button>`;
    D.contacts.forEach((p,i)=>h+=`<div class="it"><b>لینک ${i+1}</b>${fld("نوشته‌ی دکمه",`contacts.${i}.label`)}${fld("لینک (https://t.me/... یا اینستاگرام)",`contacts.${i}.url`)}${ctl("contacts",i)}</div>`);
  }
  if(tab==="posts"){
    h+=`<button class="btn sm" data-add="posts">+ پست جدید</button>`;
    D.posts.forEach((p,i)=>h+=`<div class="it"><b>پست ${i+1}</b>${fld("عنوان",`posts.${i}.title`)}${fld("تاریخ",`posts.${i}.date`)}${fld("متن",`posts.${i}.text`,"ta")}${imgField(`posts.${i}.image`)}${fld("لینک سورس",`posts.${i}.source`)}${fld("کد HTML / امبد دلخواه (ویدیو، پلیر و...)",`posts.${i}.html`,"ta")}${ctl("posts",i)}</div>`);
  }
  if(tab==="sources"){
    h+=fld("عنوان بخش","sourcesTitle")+fld("توضیح","sourcesSub","ta")+fld("منو: سورس‌ها","navSources")+`<button class="btn sm" data-add="sources">+ سورس جدید</button>`;
    D.sources.forEach((p,i)=>h+=`<div class="it"><b>سورس ${i+1}</b>${fld("عنوان",`sources.${i}.title`)}${fld("کد",`sources.${i}.code`,"ta")}${ctl("sources",i)}</div>`);
  }
  if(tab==="reviews"){
    h+=`<button class="btn sm" data-add="reviews">+ رضایت جدید</button>`;
    D.reviews.forEach((p,i)=>h+=`<div class="it"><b>رضایت ${i+1}</b>${fld("نام",`reviews.${i}.name`)}${fld("متن",`reviews.${i}.text`,"ta")}${imgField(`reviews.${i}.image`)}${ctl("reviews",i)}</div>`);
  }
  if(tab==="crypto"){
    h+=fld("عنوان بخش","cryptoTitle")+fld("توضیح","cryptoText","ta")+`<button class="btn sm" data-add="wallets">+ کیف پول جدید</button>`;
    D.wallets.forEach((p,i)=>h+=`<div class="it"><b>کیف پول ${i+1}</b>${fld("ارز (USDT/BTC/TON...)",`wallets.${i}.coin`)}${fld("شبکه",`wallets.${i}.network`)}${fld("آدرس",`wallets.${i}.address`)}${ctl("wallets",i)}</div>`);
  }
  if(tab==="stars")h+=fld("عنوان بخش","starsTitle")+fld("توضیح","starsText","ta")+fld("متن دکمه","starsBtn")+fld("لینک (مثلاً https://t.me/یوزرنیم)","starsLink");
  if(tab==="set"){
    h+=`<div class="f"><label>رمز جدید پنل (پیش‌فرض: admin)</label><input id="np" placeholder="رمز جدید"></div><button class="btn sm" data-act="np">تغییر رمز</button>
    <hr style="margin:14px 0;border-color:#333"><button class="btn sm" data-act="exp">⬇ دانلود data.json</button> <button class="btn sm sec" data-act="ld">⟳ بارگذاری از data.json سایت</button> <label class="btn sm sec" style="cursor:pointer">⬆ بازگردانی<input type="file" accept=".json" id="imp" hidden></label> <button class="btn sm red" data-act="reset">ریست کامل</button>
    <p class="sub" style="margin-top:12px">تغییرات اول فقط در مرورگر خودت ذخیره می‌شود. برای نمایش به همه: «دانلود data.json» را بزن و فایل را با همین نام در ریپو گیت‌هاب (کنار index.html) آپلود کن؛ بعد از چند ثانیه سایت برای همه آپدیت می‌شود.</p>`;
  }
  box.innerHTML=h;
}
function openAdmin(){adm.style.display="block";panel()}
function login(){
  const p=prompt("رمز مدیر:");if(p===null)return;
  if(p!==(localStorage.getItem("qd_pass")||"admin")){toast("رمز اشتباه است");return}
  openAdmin();
}
$("#adminOpen").addEventListener("dblclick",login);
$("#adminOpen").addEventListener("click",e=>{if(e.detail===3)login()});
if(location.hash==="#admin")setTimeout(login,400);

function resizeImg(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=rd.result};
  rd.readAsDataURL(file);
}
const NEW={faqs:()=>({q:"",a:""}),contacts:()=>({label:"",url:""}),sources:()=>({title:"",code:""}),posts:()=>({title:"",text:"",image:"",source:"",html:"",date:new Date().toLocaleDateString("fa-IR")}),reviews:()=>({name:"",text:"",image:""}),wallets:()=>({coin:"",network:"",address:""})};
box.addEventListener("input",e=>{const p=e.target.dataset.p;if(p&&!e.target.readOnly)set(D,p,e.target.value)});
box.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.img&&t.files[0])resizeImg(t.files[0],d=>{set(D,t.dataset.img,d);panel()});
  if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{D={...DEF,...JSON.parse(r.result)};panel();toast("بازگردانی شد، ذخیره بزن")}catch(_){toast("فایل نامعتبر")}};r.readAsText(t.files[0])}
});
box.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;panel()}
  else if(d.add){D[d.add].unshift(NEW[d.add]());panel()}
  else if(d.del){const[a,i]=d.del.split(".");if(confirm("حذف شود؟")){D[a].splice(+i,1);panel()}}
  else if(d.up||d.dn){const[a,i]=(d.up||d.dn).split(".");const n=+i+(d.up?-1:1),A=D[a];if(n>=0&&n<A.length){[A[i],A[n]]=[A[n],A[i]];panel()}}
  else if(d.clr){set(D,d.clr,"");panel()}
  else if(d.act==="save")save();
  else if(d.act==="close"){adm.style.display="none";render()}
  else if(d.act==="np"){const v=$("#np").value;if(v){localStorage.setItem("qd_pass",v);toast("رمز تغییر کرد (فقط روی این مرورگر)")}}
  else if(d.act==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="data.json";a.click()}
  else if(d.act==="ld"){try{const r=await fetch("data.json?"+Date.now());D={...DEF,...await r.json()};panel();toast("بارگذاری شد، ذخیره بزن")}catch(_){toast("data.json پیدا نشد")}}
  else if(d.act==="reset"){if(confirm("همه چیز پاک و به پیش‌فرض برگردد؟")){D=JSON.parse(JSON.stringify(DEF));panel()}}
});
load();
</script>
